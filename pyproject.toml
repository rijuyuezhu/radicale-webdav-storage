[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "radicale-webdav-storage"
version = "0.1.0"
description = "A stateless WebDAV-backed storage plugin for Radicale"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
keywords = ["radicale", "caldav", "webdav", "calendar"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Scheduling",
]
dependencies = [
  "Radicale>=3.8,<4",
  "httpx>=0.27,<1",
]

[project.urls]
Homepage = "https://github.com/rijuyuezhu/radicale-webdav-storage"
Repository = "https://github.com/rijuyuezhu/radicale-webdav-storage"
Issues = "https://github.com/rijuyuezhu/radicale-webdav-storage/issues"
Documentation = "https://github.com/rijuyuezhu/radicale-webdav-storage#readme"
Changelog = "https://github.com/rijuyuezhu/radicale-webdav-storage/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "mypy>=1.17",
  "pytest>=8",
  "ruff>=0.12",
]


[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = ["integration: requires a real WebDAV endpoint"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
